# GENERATED by scripts/gen_capbg_ensemble_configs.py -- do not edit by hand.
# cap-bg Nebius ensemble pilot: RoboMME VideoUnmaskSwap (trial k = test episode k-1)
# = env_configs/robomme/robomme_videounmaskswap.yaml with the multimodel parallel ensemble ON:
#   candidates gpt-oss-120b / Qwen3-235B-A22B-Instruct-2507 / DeepSeek-V4-Flash-0731 x temperatures 0.1, 0.5, 0.9 (9 replies per query),
#   synthesis DeepSeek-V4-Pro (upstream synthesis prompt). All coding-side models are text-only.
# condition_video_mode auto -> vdm_text (if a coding-side model is text-only): the VDM describes the
# conditioning video part by part (condition_video_* keys) and the text replaces the images in the first prompt.
# Everything else (prompts, APIs, servers, VDM on, video, max_tokens, budgets) is the baseline's.
# VDM: --visual-differencing-model Qwen/Qwen3.8-27B (as the baseline). Molmo2-8B server at 127.0.0.1:8122 as for the baseline.
# Requires the baseline venv (.venv-robomme). Run: python scripts/run_ensemble_pilot.py --bench robomme ...  (docs/capbg-ensemble.md)

env:
  _target_: capx.envs.tasks.robomme.robomme_env.RoboMMECodeEnv
  cfg:
    _target_: capx.envs.tasks.base.CodeExecEnvConfig
    low_level:
      _target_: capx.envs.simulators.robomme.RoboMMEEnv
      task_id: VideoUnmaskSwap
      episode_idx: 0
      dataset: test
      privileged: false
      max_steps: 1300
      condition_frames: 32
    privileged: false
    apis:
      - FrankaRoboMMEApiReducedSkillLibrary
    prompt: |
      You are controlling a Franka Emika robot with API described below.
      Goal: {libero_environment_goal}
      You may write python code comments for reasoning but ONLY write the executable Python code and do not write it in code fences.
      After this code executes, you will be able to get a new observation of the environment and write new code to complete the task if needed.
      The functions (APIs) below are already imported to the environment. If you want to use numpy, you need to import it explicitly.

    multi_turn_prompt: |
      The following code blocks were just executed:
      ```python
      {executed_code}
      ```
      The current console stdout is:
      ```
      {console_stdout}
      ```
      The current console stderr is:
      ```
      {console_stderr}
      ```
      If there were no errors during compilation or execution, the console stderr will be empty. If there were errors, consider regenerating the code.
      Please respond with EXACTLY ONE of the following:
      - The word 'REGENERATE' followed immediately by new Python code in a fenced code block (```python...```) if you want to modify the code.
      - The word 'FINISH' if the task appears to be complete

api_servers:
  - _target_: capx.serving.launch_pyroki_server.main
    port: 8116
    host: 127.0.0.1
    robot: panda_description
    target_link: panda_hand
  - _target_: capx.serving.launch_contact_graspnet_server.main
    port: 8115
    host: 127.0.0.1
  - _target_: capx.serving.launch_sam3_server.main
    device: cuda
    port: 8114
    host: 127.0.0.1
memory_mode: none
use_parallel_ensemble: true
use_multimodel: true
# Multimodel ensemble: every (model, temperature) is one candidate reply; failed candidates are left out.
ensemble:
  candidates:
    - model: openai/gpt-oss-120b
      temperatures: [0.1, 0.5, 0.9]
    - model: Qwen/Qwen3-235B-A22B-Instruct-2507
      temperatures: [0.1, 0.5, 0.9]
    - model: deepseek-ai/DeepSeek-V4-Flash-0731
      temperatures: [0.1, 0.5, 0.9]
  synthesis_model: deepseek-ai/DeepSeek-V4-Pro
# Conditioning video: images | vdm_text | auto (auto = vdm_text when a coding-side model is text-only).
condition_video_mode: auto
# vdm_text: every stride-th frame, segment_frames per VDM call, overlap frames shared with the previous call,
# at most max_segments calls (the stride grows if needed).
condition_video_stride: 1
condition_video_segment_frames: 20
condition_video_overlap: 4
condition_video_max_segments: 12
use_img_differencing: true
use_visual_feedback: false
use_video_differencing: false
use_wrist_camera: false
record_video: true
save_multiturn_prompts: true
# Per-reply token limit for the coding model and the VDM (CLI --max-tokens overrides); as the LIBERO-Mem baseline.
max_tokens: 32768
trial_timeout_s: 3600
max_trial_retries: 1
output_dir: ./outputs/capbg_ensemble/robomme/robomme_videounmaskswap

trials: 50
num_workers: 1
