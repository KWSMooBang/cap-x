# GENERATED by scripts/gen_capbg_baseline_configs.py -- do not edit by hand.
# cap-bg baseline: LIBERO-Mem task 0 (KITCHEN_SCENE1_1_pick_up_the_bowl_and_place_it_back_on_the_plate)
# CaP-Agent0 settings (env_configs/libero/franka_libero_cap_agent0.yaml) with the parallel ensemble OFF.
# Ensemble ablation: add --use-parallel-ensemble True --use-multimodel True on the CLI.
#
# Molmo: FrankaLiberoApiReducedSkillLibrary.point_prompt_molmo calls a Molmo2-8B vLLM server at
# 127.0.0.1:8122. The molmo extra (vllm) conflicts with --extra libero-mem, so it is NOT in api_servers below;
# start it separately from .venv-molmo before launching (see docs/capbg-baseline.md):
#   .venv-molmo/bin/python capx/serving/vllm_server.py --model allenai/Molmo2-8B --port 8122 \
#       --max-model-len 16384 --max-num-batched-tokens 16384
#
# Requires: uv sync --active --extra libero-mem --extra contactgraspnet (.venv-libero-mem); MUJOCO_GL=osmesa PYOPENGL_PLATFORM=osmesa NUMBA_DISABLE_JIT=1
# Run: uv run --no-sync --active capx/envs/launch.py --config-path env_configs/capbg_baseline/libero_mem/task_00_pick_bowl_back_on_plate.yaml --model <MODEL> ...

env:
  _target_: capx.envs.tasks.franka.franka_libero_mem_env.FrankaLiberoMemCodeEnv
  cfg:
    _target_: capx.envs.tasks.base.CodeExecEnvConfig
    low_level:
      _target_: capx.envs.simulators.libero_mem.FrankaLiberoMemEnv
      task_id: 0
      privileged: false
      max_steps: 8000
      control_freq: 20
    privileged: false
    apis:
      - FrankaLiberoApiReducedSkillLibrary
    prompt: |
      You are controlling a Franka Emika robot with API described below.
      Goal: {libero_environment_goal}
      You may write python code comments for reasoning but ONLY write the executable Python code and do not write it in code fences.
      After this code executes, you will be able to get a new observation of the environment and write new code to complete the task if needed.
      The functions (APIs) below are already imported to the environment. If you want to use numpy, you need to import it explicitly.

    multi_turn_prompt: |
      The following code blocks were just executed:
      ```python
      {executed_code}
      ```
      The current console stdout is:
      ```
      {console_stdout}
      ```
      The current console stderr is:
      ```
      {console_stderr}
      ```
      If there were no errors during compilation or execution, the console stderr will be empty. If there were errors, consider regenerating the code.
      Please respond with EXACTLY ONE of the following:
      - The word 'REGENERATE' followed immediately by new Python code in a fenced code block (```python...```) if you want to modify the code.
      - The word 'FINISH' if the task appears to be complete

api_servers:
  - _target_: capx.serving.launch_pyroki_server.main
    port: 8116
    host: 127.0.0.1
    robot: panda_description
    target_link: panda_hand

  - _target_: capx.serving.launch_contact_graspnet_server.main
    port: 8115
    host: 127.0.0.1

  - _target_: capx.serving.launch_sam3_server.main
    device: cuda
    port: 8114
    host: 127.0.0.1

use_parallel_ensemble: false
use_multimodel: false
use_img_differencing: true
use_visual_feedback: false
use_video_differencing: false
use_wrist_camera: false
record_video: true
save_multiturn_prompts: true
output_dir: ./outputs/capbg_baseline/libero_mem/task_00_pick_bowl_back_on_plate

trials: 50
num_workers: 10
