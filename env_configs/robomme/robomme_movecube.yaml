# GENERATED by scripts/gen_robomme_configs.py -- do not edit by hand.
# RoboMME MoveCube (Imitation suite), test split. CaP-X baseline (memory_mode none) with the cap-bg LIBERO-Mem
# baseline settings: CaP-Agent0 prompts, FrankaRoboMMEApiReducedSkillLibrary (same functions as
# FrankaLiberoApiReducedSkillLibrary), parallel ensemble OFF, VDM on, video on, max_tokens 32768.
# Reset returns a conditioning video: 32 uniformly sampled front-camera frames go into the first prompt
# (as MME-VLA framesamp-modul: 512 tokens / 16 per frame). Fallback if the model limits images: CAPX_ROBOMME_CONDITION_FRAMES=16.
# Trial k plays test episode k-1 (fixed). Budget: 1300 control steps (RoboMME paper), 3600 s wall clock, one attempt.
# Molmo (point_prompt_molmo) needs a separate Molmo2-8B vLLM server at 127.0.0.1:8122 (see docs/capbg-baseline.md).
#
# Requires: uv sync --active --extra robomme --extra contactgraspnet (.venv-robomme, Python >= 3.11) and an NVIDIA Vulkan ICD.
# Run: python capx/envs/launch.py --config-path env_configs/robomme/robomme_movecube.yaml \
#        --model moonshotai/Kimi-K3 --visual-differencing-model Qwen/Qwen3.8-27B ...  (see docs/memory-benchmarks.md)

env:
  _target_: capx.envs.tasks.robomme.robomme_env.RoboMMECodeEnv
  cfg:
    _target_: capx.envs.tasks.base.CodeExecEnvConfig
    low_level:
      _target_: capx.envs.simulators.robomme.RoboMMEEnv
      task_id: MoveCube
      episode_idx: 0
      dataset: test
      privileged: false
      max_steps: 1300
      condition_frames: 32
    privileged: false
    apis:
      - FrankaRoboMMEApiReducedSkillLibrary
    prompt: |
      You are controlling a Franka Emika robot with API described below.
      Goal: {libero_environment_goal}
      You may write python code comments for reasoning but ONLY write the executable Python code and do not write it in code fences.
      After this code executes, you will be able to get a new observation of the environment and write new code to complete the task if needed.
      The functions (APIs) below are already imported to the environment. If you want to use numpy, you need to import it explicitly.

    multi_turn_prompt: |
      The following code blocks were just executed:
      ```python
      {executed_code}
      ```
      The current console stdout is:
      ```
      {console_stdout}
      ```
      The current console stderr is:
      ```
      {console_stderr}
      ```
      If there were no errors during compilation or execution, the console stderr will be empty. If there were errors, consider regenerating the code.
      Please respond with EXACTLY ONE of the following:
      - The word 'REGENERATE' followed immediately by new Python code in a fenced code block (```python...```) if you want to modify the code.
      - The word 'FINISH' if the task appears to be complete

api_servers:
  - _target_: capx.serving.launch_pyroki_server.main
    port: 8116
    host: 127.0.0.1
    robot: panda_description
    target_link: panda_hand
  - _target_: capx.serving.launch_contact_graspnet_server.main
    port: 8115
    host: 127.0.0.1
  - _target_: capx.serving.launch_sam3_server.main
    device: cuda
    port: 8114
    host: 127.0.0.1
memory_mode: none
use_parallel_ensemble: false
use_multimodel: false
use_img_differencing: true
use_visual_feedback: false
use_video_differencing: false
use_wrist_camera: false
record_video: true
save_multiturn_prompts: true
# Per-reply token limit for the coding model and the VDM (CLI --max-tokens overrides); as the LIBERO-Mem baseline.
max_tokens: 32768
trial_timeout_s: 3600
max_trial_retries: 1
output_dir: ./outputs/robomme/robomme_movecube

trials: 50
num_workers: 1
